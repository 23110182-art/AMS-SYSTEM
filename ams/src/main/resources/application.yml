spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ams_db
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        "format_sql": true
        dialect: org.hibernate.dialect.MySQLDialect

  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp

